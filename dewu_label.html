<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中通面单演示样例</title>
<style>
  :root { --ink:#111; --line:#222; --paper:#fff; --bg:#e9e6e1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; color:var(--ink); }
  .panel { max-width: 640px; margin: 16px auto; padding: 12px 16px; background:#fff; border-radius:10px; font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .panel input { flex:1; min-width:180px; padding:6px 8px; font-size:14px; border:1px solid #bbb; border-radius:6px; }
  .panel button { padding:6px 14px; border:0; border-radius:6px; background:#111; color:#fff; cursor:pointer; }
  .panel small { width:100%; color:#666; }
  .sheet { width: 100mm; margin: 0 auto 24px; display:flex; flex-direction:column; background:var(--paper); border-radius:3mm; box-shadow:0 1px 4px rgba(0,0,0,.15); overflow:hidden; }
  [contenteditable]:focus { outline: 1px dashed #4a8; }

  /* ===== 上半部分：面单 ===== */
  .label { position:relative; width:100mm; height:125mm; background:var(--paper); padding:3mm 7mm 3mm 7mm; overflow:hidden; }
  .side-no { position:absolute; font-family: "Courier New", monospace; font-size:2.6mm; letter-spacing:.2mm; writing-mode: vertical-rl; }
  .side-no.l1 { left:1.6mm; top:30mm; }
  .side-no.l2 { left:1.6mm; top:78mm; }
  .side-no.r1 { right:1.4mm; top:30mm; }
  .side-no.r2 { right:1.4mm; top:78mm; }

  .head { display:flex; justify-content:space-between; align-items:flex-start; height:17mm; }
  .brand { display:flex; align-items:center; gap:2mm; margin-top:2mm; }
  .brand .mark { width:9mm; height:9mm; background:#111; color:#fff; border-radius:2mm; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:3.6mm; letter-spacing:-.2mm; }
  .brand .txt b { display:block; font-size:4.6mm; line-height:1; font-weight:800; }
  .brand .txt span { display:block; font-size:2.3mm; letter-spacing:.6mm; font-weight:700; font-style:italic; margin-top:.6mm; }
  .kind { font-size:6.2mm; line-height:1.05; text-align:right; font-weight:500; }

  .meta { font-size:3mm; display:flex; gap:4mm; padding-bottom:1mm; border-bottom:.3mm solid var(--line); font-family:"Courier New",monospace; }
  .meta .cnt { font-family:inherit; }
  .sort { font-size:10mm; font-weight:500; text-align:center; letter-spacing:.5mm; padding:1mm 0 1.5mm; border-bottom:.3mm solid var(--line); white-space:pre; }

  .body { display:flex; height:calc(125mm - 3mm - 17mm - 5mm - 14.5mm - 3mm); }
  .main { flex:1; border-right:.3mm solid var(--line); display:flex; flex-direction:column; }
  .vbar { width:16mm; display:flex; align-items:center; justify-content:center; gap:.6mm; }
  .vbar svg { width:10.5mm; height:62mm; }
  .vbar .vno { writing-mode:vertical-rl; font-family:"Courier New",monospace; font-size:2.6mm; }

  .hbar { padding:1.5mm 2mm 1mm; text-align:center; border-bottom:.3mm solid var(--line); }
  .hbar svg { width:100%; height:11mm; display:block; }
  .hbar .no { font-family:"Courier New",monospace; font-size:3.4mm; letter-spacing:.3mm; margin-top:.5mm; }

  .tags { display:flex; justify-content:flex-start; padding:1.2mm 2mm; }
  .tag { background:#111; color:#fff; font-size:3.4mm; padding:.6mm 1.4mm; border-radius:.5mm; margin-left:24mm; }
  .tag:first-child { margin-left:0; }
  .dest { font-size:4mm; padding:0 2mm 1.2mm; border-bottom:.3mm solid var(--line); min-height:7mm; }
  .gap { height:5mm; border-bottom:.3mm solid var(--line); }

  .party { padding:1.5mm 2mm; display:flex; gap:2mm; }
  .party + .party { border-top:.3mm solid var(--line); }
  .pin { flex:none; width:6.5mm; height:6.5mm; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:#111; display:flex; align-items:center; justify-content:center; margin-top:.8mm; }
  .pin i { transform:rotate(45deg); color:#fff; font-style:normal; font-size:3.2mm; font-weight:700; }
  .pin.outline { background:#fff; border:.35mm solid #111; width:5mm; height:5mm; }
  .pin.outline i { color:#111; font-size:2.4mm; }
  .who { font-size:3.4mm; display:flex; gap:7mm; margin-left:5mm; }
  .addr { font-size:3.8mm; line-height:1.25; margin-top:.8mm; }
  .party.send .who { font-size:2.9mm; }
  .party.send .addr { font-size:3.2mm; }

  /* ===== 下半部分：平台贴签 ===== */
  .sticker { position:relative; width:100mm; height:46mm; background:var(--paper); padding:4mm 6mm; border-top:.3mm dashed #999; }
  .sticker .checked { position:absolute; right:6mm; bottom:14mm; font-size:3mm; }
  .sticker .foot { position:absolute; left:4mm; bottom:3.5mm; display:flex; align-items:center; gap:2mm; }
  .sticker .mark { width:10mm; height:10mm; background:#111; color:#fff; border-radius:2.2mm; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:3.8mm; }
  .brand .zto { font-family: Arial Black, Arial, sans-serif; font-weight:900; font-style:italic; font-size:8mm; letter-spacing:-.6mm; line-height:1; transform:skewX(-6deg); }
  .sticker .mark.xhs { font-size:2.9mm; letter-spacing:-.2mm; }
  .wm { position:absolute; inset:0; pointer-events:none; z-index:5; background-repeat:repeat; opacity:.13; }
  .sheet { position:relative; }
  .sticker .demo { position:absolute; right:3mm; bottom:2mm; font-size:1.3mm; color:#e0e0e0; }
  .sticker .slogan { font-size:3.3mm; line-height:1.3; }
  
  @media print {
    body { background:#fff; }
    .panel { display:none; }
    .sheet { margin:0; box-shadow:none; border-radius:0; }
    @page { size: 100mm 171mm; margin:0; }
  }
</style>
</head>
<body>

<div class="panel">
  <label for="no">运单号：</label>
  <input id="no" value="731234567890">
  <button onclick="render()">更新条码</button>
  <small>面单上的文字都可以直接点击修改；改完单号点"更新条码"，所有条码和边缘竖排单号会同步。打印时控制栏自动隐藏，整张面单一页打印（100×171mm）。</small>
</div>

<div class="sheet">
  <!-- 上半部分 -->
  <div class="label">
    <div class="side-no l1 sn"></div><div class="side-no l2 sn"></div>
    <div class="side-no r1 sn"></div><div class="side-no r2 sn"></div>

    <div class="head">
      <div class="brand">
        <div class="zto">ZTO</div>
        <div class="txt"><b contenteditable>中通速递</b><span contenteditable>ZTO EXPRESS</span></div>
      </div>
      <div class="kind" contenteditable>快递<br>包裹</div>
    </div>

    <div class="meta"><span contenteditable>2026/10/14</span><span contenteditable>13:08:00</span><span class="cnt" contenteditable>第1/1个</span></div>
    <div class="sort" contenteditable>300-  A6  48</div>

    <div class="body">
      <div class="main">
        <div class="hbar"><svg class="bc" preserveAspectRatio="none"></svg><div class="no sn-h"></div></div>
        <div class="tags"><span class="tag" contenteditable>末</span><span class="tag" contenteditable>组</span></div>
        <div class="dest" contenteditable>沪西</div>
        <div class="gap"></div>
        <div class="party">
          <div class="pin"><i>收</i></div>
          <div>
            <div class="who"><span contenteditable>张*</span><span contenteditable>138****0000</span></div>
            <div class="addr" contenteditable>上海上海市嘉定区马陆镇示例路100号</div>
          </div>
        </div>
        <div class="party send">
          <div class="pin outline"><i>寄</i></div>
          <div>
            <div class="who"><span contenteditable>李*</span><span contenteditable>150****0000</span></div>
            <div class="addr" contenteditable>江苏省苏州市常熟市常熟经济技术开发区示例路25号</div>
          </div>
        </div>
      </div>
      <div class="vbar">
        <div class="vno sn"></div>
        <svg class="bc-v" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>

  <!-- 下半部分 -->
  <div class="sticker">
    <div class="checked" contenteditable>已验视</div>
    <div class="demo">演示样例</div>
    <div class="foot">
      <div class="mark xhs">小红书</div>
      <div class="slogan" contenteditable>你的<br>生活指南</div>
    </div>
  </div>
</div>

<script>
// Code 128B barcode generator
const P = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128(text){
  const codes=[104]; for(const ch of text){ const c=ch.charCodeAt(0)-32; codes.push(c>=0&&c<95?c:0); }
  let sum=104; for(let i=1;i<codes.length;i++) sum+=codes[i]*i;
  codes.push(sum%103); codes.push(106);
  return codes.map(c=>P[c]).join("");
}
function drawBars(svg, text, vertical){
  const pat=code128(text); let total=0; for(const d of pat) total+=+d;
  let x=0, out="";
  for(let i=0;i<pat.length;i++){ const w=+pat[i];
    if(i%2===0) out+= vertical ? `<rect x="0" y="${x}" width="10" height="${w}"/>` : `<rect x="${x}" y="0" width="${w}" height="10"/>`;
    x+=w; }
  svg.setAttribute("viewBox", vertical ? `0 0 10 ${total}` : `0 0 ${total} 10`);
  svg.innerHTML = `<g fill="#111">${out}</g>`;
}
function render(){
  const no=document.getElementById("no").value.trim()||"730000000000";
  document.querySelectorAll(".bc").forEach(s=>drawBars(s,no,false));
  document.querySelectorAll(".bc-v").forEach(s=>drawBars(s,no,true));
  document.querySelectorAll(".sn,.sn-h").forEach(e=>e.textContent=no);
}
render();
</script>
</body>
</html>
